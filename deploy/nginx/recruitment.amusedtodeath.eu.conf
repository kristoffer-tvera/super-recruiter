server {
    listen 80;
    listen [::]:80;
    server_name recruitment.amusedtodeath.eu;
    include /etc/nginx/snippets/site-acme.conf;

    location / {
        return 308 https://recruitment.amusedtodeath.eu$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name recruitment.amusedtodeath.eu;
    ssl_certificate /etc/letsencrypt/live/recruitment.amusedtodeath.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruitment.amusedtodeath.eu/privkey.pem;
    include /etc/nginx/snippets/site-tls.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/site-proxy.conf;
        proxy_pass http://127.0.0.1:18051;
    }

    location / {
        include /etc/nginx/snippets/site-proxy.conf;
        proxy_pass http://127.0.0.1:18050;
    }
}